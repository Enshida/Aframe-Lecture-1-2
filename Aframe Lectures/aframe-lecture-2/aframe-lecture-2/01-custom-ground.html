<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creating a Custom Ground in A-Frame</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Asset Management System -->
    <a-assets>
      <img id="floor" src="assets/floor-diff.jpg">
      <img id="floor-NRM" src="assets/floor-nor.jpg">
    </a-assets>

    <!-- Step 2: plain ground -> <a-plane material="color: #CCCCCC" rotation="-90 0 0" scale="10 10 1"> -->
    <!-- Steps 3-4: texture + normal map. Challenge: roughness 0.6 (try 0.2 and 0.8) -->
    <a-plane material="color: #FFFFFF; src: #floor; repeat: 5 5; normal-map: #floor-NRM; normal-texture-repeat: 5 5; roughness: 0.6"
             rotation="-90 0 0" scale="10 10 1"></a-plane>
  </a-scene>
</body>
</html>
