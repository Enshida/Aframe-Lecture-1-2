<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customizing the Camera in A-Frame</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Asset Management System -->
    <a-assets>
      <img id="floor" src="assets/floor-1024.jpg">
      <img id="average-height" src="assets/average-height.png">
    </a-assets>

    <!-- Ground -->
    <a-plane src="#floor" shader="flat" rotation="-90 0 0" scale="5 5 1"></a-plane>

    <!-- Step 2: two reference objects on opposite sides of the camera -->
    <a-cylinder color="#AA0000" radius="0.5" height="2" position="-2 1 0"></a-cylinder>
    <a-box color="#00AA00" height="2" depth="4" position="2 1 0"></a-box>

    <!-- Step 3: average-height guide (simulates eye level, about 1.6 m) -->
    <a-image src="#average-height" scale="2 2 1" position="0 1 0"></a-image>

    <!-- Step 4: cameras at different heights. Only one is active at a time -->
    <!-- a. Adult height (1.6m, default) -->
    <a-entity position="0 0 5">
      <a-camera user-height="1.6" active="false"></a-camera>
    </a-entity>
    <!-- b. Kid height (0.9m) -->
    <a-entity position="0 0 5">
      <a-camera user-height="0.9" active="true"></a-camera>
    </a-entity>
    <!-- c. Aerial camera (6.6m) -->
    <a-entity position="0 5 5">
      <a-camera active="false"></a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
