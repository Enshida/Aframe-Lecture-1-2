<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textures and Materials</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
      <img id="metal" src="assets/metal.jpg">
      <img id="metal-NRM" src="assets/metal-NRM.jpg">
      <img id="brick" src="assets/brick.jpg">
      <img id="brick-NRM" src="assets/brick-NRM.jpg">
    </a-assets>

    <!-- Metal box with normal map -->
    <a-box material="color: #FFFFFF; src: #metal; repeat: 2 2; normal-map: #metal-NRM; normal-texture-repeat: 2 2; normal-scale: 1 -1; roughness: 0.5"
           width="4" height="4" depth="4" position="-2 1.5 -9" scale="-1 1 1" side="double"></a-box>
    <!-- Brick box (scale -1 1 1 flips it inside-out, like a room) -->
    <a-box material="color: #FFFFFF; src: #brick; repeat: 2 2; normal-map: #brick-NRM; normal-texture-repeat: 2 2; normal-scale: 1 -1; roughness: 0.9"
           width="4" height="4" depth="4" position="2 1.5 -9" scale="-1 1 1" side="double"></a-box>

    <!-- Blue glossy sphere (standard shader) -->
    <a-sphere material="color: #0000AA; roughness: 0.2; shader: standard" radius="0.5" position="-2 1.5 -8"></a-sphere>
    <!-- Red semi-transparent sphere (flat shader ignores light) -->
    <a-sphere material="color: #AA0000; roughness: 0.2; shader: flat; opacity: 0.5" radius="0.5" position="2 1.5 -8"></a-sphere>
  </a-scene>
</body>
</html>
