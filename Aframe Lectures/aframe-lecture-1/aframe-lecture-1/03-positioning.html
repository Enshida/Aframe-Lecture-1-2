<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positioning Objects in 3D Space</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- Parent panel: children inherit its position -->
    <a-box color="#689F38" width="8" height="4.5" depth="0.2" position="0 3 -7">
      <!-- Child circle: relative position (2m right, 11cm toward viewer) -->
      <a-circle color="#333333" side="double" position="2 0 0.11"></a-circle>
    </a-box>
    <!-- Absolute position circle -->
    <a-circle color="#FFC107" side="double" position="-2 3 -6.89"></a-circle>
    <a-cylinder color="#616161" height="2" radius="2" segments-radial="6" open-ended="true" side="double" position="0 1 0"></a-cylinder>
  </a-scene>
</body>
</html>
